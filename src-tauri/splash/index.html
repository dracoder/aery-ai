<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeryx</title>
<style>
  @font-face { font-family: "Orbitron"; font-weight: 400 900; src: url(orbitron-latin-var.woff2) format("woff2"); }
  @font-face { font-family: "Rajdhani"; font-weight: 500; src: url(rajdhani-latin-500.woff2) format("woff2"); }
  :root { --ink: #05080f; --cyan: #7fe3ff; --ice: #eafcff; --muted: #a6c6de; --red: #ffb4a8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: radial-gradient(ellipse at 50% 30%, #0d2d5c 0%, var(--ink) 65%); color: var(--ice); font: 17px/1.5 "Rajdhani", system-ui, sans-serif; }
  main { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
  .box { max-width: 460px; display: grid; gap: 18px; justify-items: center; }
  img { width: 112px; height: 112px; filter: drop-shadow(0 0 22px rgba(80,190,255,.7)); animation: breathe 2.4s ease-in-out infinite; }
  h1 { font: 800 26px "Orbitron", sans-serif; letter-spacing: .3em; }
  .beta { margin-top: -10px; padding: 2px 10px; border: 1px solid rgba(127,227,255,.4); border-radius: 999px; color: var(--cyan); font: 500 12px "Rajdhani", sans-serif; letter-spacing: .2em; text-transform: uppercase; }
  #status { color: var(--muted); min-height: 3em; }
  #status.err { color: var(--red); }
  .bar { width: 220px; height: 3px; background: rgba(127,227,255,.15); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: slide 1.4s ease-in-out infinite; }
  .done .bar { display: none; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @keyframes breathe { 50% { filter: drop-shadow(0 0 34px rgba(80,190,255,1)); } }
  @media (prefers-reduced-motion: reduce) { img, .bar i { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="box" id="box">
    <img src="mark.svg" alt="">
    <h1>AERYX</h1>
    <span class="beta">desktop beta</span>
    <div class="bar" aria-hidden="true"><i></i></div>
    <p id="status" role="status">Waking Aeryx…</p>
  </div>
</main>
<script>
  window.setStatus = (text, isError) => {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = isError ? 'err' : '';
    document.getElementById('box').classList.toggle('done', !!isError);
  };
</script>
</body>
</html>
