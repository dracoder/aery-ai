name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gate
      - run: npm run build
      - name: build the Lair
        run: |
          npm ci --prefix lair
          npm run build:lair

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      AERYX_SOURCE: ${{ github.workspace }}
      AERYX_NO_OPEN: '1'
      AERYX_APP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - shell: bash
        run: echo "AERYX_DIR=$RUNNER_TEMP/aeryx" >> "$GITHUB_ENV"
      - name: install (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh site/install.sh
      - name: install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./site/install.ps1
      - name: a fresh install waits for setup
        shell: bash
        run: curl -fsS http://127.0.0.1:23799/status | grep -q '"setupNeeded":true'
      - name: uninstall (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          "$AERYX_DIR/bin/aeryx" uninstall --yes
          test ! -e "$AERYX_DIR"
      - name: uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:AERYX_DIR\bin\aeryx.cmd" uninstall --yes
          Start-Sleep -Seconds 6
          if (Test-Path -LiteralPath $env:AERYX_DIR) { throw "uninstall left $env:AERYX_DIR behind" }

