    text-align: left; padding: 2px 10px 6px 0; }
  .panel td { padding: 5px 10px 5px 0; color: var(--body);

  }

<body>
<header id="lensTop">
  <a class="brand" href="/hud" aria-label="Aeryx Dragon">AERYX</a><span class="mode">Lens / live canvas</span>
  <nav aria-label="Aeryx navigation"><a href="/hud">Dragon</a><a href="/lair">Lair</a></nav>
  <div id="lensStyles" role="group" aria-label="Persona"><button type="button" data-style="aeryx" aria-pressed="true">Aeryx</button><button type="button" data-style="aeri" aria-pressed="false">Aeri</button></div>
</header>
<div id="field"></div>
<div id="grid"></div>
<canvas id="embers"></canvas>

<div id="stage">
  <div id="orbWrap"><canvas id="core"></canvas></div>
  <div id="invite">
    <h1>Nothing on the table</h1>
    <p>Ask, and what Aeryx is working with appears here. Panels arrive with the conversation — this canvas never invents one.</p>
  </div>
  <div id="rail">
    <div class="metric"><div class="k">Brain</div><div class="v" id="mBrain">—</div></div>
    <div class="metric"><div class="k">Approvals</div><div class="v" id="mAppr">—</div></div>
    <div class="metric"><div class="k">Chain</div><div class="v" id="mChain">—</div></div>
    <div class="metric"><div class="k">Uptime</div><div class="v" id="mUp">—</div></div>
  </div>
  <div id="panels"></div>
  <canvas id="wave" width="560" height="90"></canvas>
</div>

<script src="/orb.js"></script>
<script>
  'use strict';
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const orb = AeryxOrb.attach($('core'), 320, { state: 'offline' });
  const styleButtons = document.querySelectorAll('#lensStyles [data-style]');
  function setLensStyle(style) {
    if (style !== 'aeryx' && style !== 'aeri') return;
    AeryxOrb.setVisualStyle(style);
    styleButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.style === style)));
    try { localStorage.setItem('aeryx.persona', style); } catch { }
  }
  styleButtons.forEach((button) => button.addEventListener('click', () => setLensStyle(button.dataset.style)));
  try { if (localStorage.getItem('aeryx.persona') === 'aeri') setLensStyle('aeri'); } catch { }
  addEventListener('storage', (event) => { if (event.key === 'aeryx.persona' || event.key === 'aeryx.theme') setLensStyle(event.newValue); });

  const panels = [];
  function syncLayout() { document.body.classList.toggle('has-panels', panels.length > 0); }
  syncLayout();

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderDoc(md) {
    const doc = el('div', 'doc');
    let para = [];
    const flush = () => { if (para.length) { doc.appendChild(el('p', null, para.join(' '))); para = []; } };
    for (const raw of String(md).split('\n')) {
      const line = raw.trim();
      if (!line) { flush(); continue; }
      const h = /^#{1,6}\s+(.*)/.exec(line);
      if (h) { flush(); doc.appendChild(el('h3', null, h[1])); continue; }
      const b = /^[-*]\s+(.*)/.exec(line);
      if (b) { flush(); doc.appendChild(el('li', null, b[1])); continue; }
      para.push(line);
    }
    flush();
    return doc;
  }

  function renderTable(p) {
    const wrap = el('div');
    if (!p.rows || p.rows.length === 0) {
      wrap.appendChild(el('div', 'empty', 'nothing in this store yet — honestly empty'));
      return wrap;
    }
    const table = el('table'), thead = el('thead'), tr = el('tr');
    for (const h of p.header || []) tr.appendChild(el('th', null, h));
    thead.appendChild(tr); table.appendChild(thead);
    const tbody = el('tbody');
    for (const row of p.rows) {
      const r = el('tr');
      for (const cell of row) r.appendChild(el('td', null, String(cell)));
      tbody.appendChild(r);
    }
    table.appendChild(tbody); wrap.appendChild(table);
    if (p.truncated) wrap.appendChild(el('div', 'morenote', `…and ${p.truncated} more — the Lair has the rest`));
    return wrap;
  }

  function buildPanel(entry) {
    const p = entry.p;
    const box = el('article', 'panel');
    box.appendChild(el('span', 'bracket tl'));
    box.appendChild(el('span', 'bracket br'));
    const head = el('div', 'head');
    head.appendChild(el('div', 't', p.title));
    const chips = el('div', 'chips');
    if (p.taint) chips.appendChild(el('span', 'chip taint', 'pulls external content'));
    chips.appendChild(el('span', 'chip', `${p.source} · ${new Date(p.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`));
    const pin = el('button', null, 'PIN');
    pin.title = 'pinned panels are never evicted and take primary';
    pin.onclick = () => { entry.pinned = !entry.pinned; entry.pinnedAt = Date.now(); pin.classList.toggle('on', entry.pinned); layoutPanels(); };
    const close = el('button', null, '✕');
    close.title = 'dismiss';
    close.onclick = () => removePanel(entry);
    chips.appendChild(pin); chips.appendChild(close);
    head.appendChild(chips);
    box.appendChild(head);
    const body = el('div', 'body');
    body.appendChild(p.template === 'document' ? renderDoc(p.body || '') : renderTable(p));
    box.appendChild(body);
    return box;
  }

  function removePanel(entry) {
    const i = panels.indexOf(entry);
    if (i < 0) return;
    panels.splice(i, 1);
    entry.el.classList.add('leaving');
    setTimeout(() => { entry.el.remove(); syncLayout(); }, reduced ? 130 : 420);
    layoutPanels();
  }

  function layoutPanels() {
    let primary = null;
    for (const e of panels) if (e.pinned && (!primary || e.pinnedAt > primary.pinnedAt)) primary = e;
    if (!primary) for (const e of panels) if (e.p.opened === 'conversation') primary = e;
    if (!primary && panels.length) primary = panels[panels.length - 1];
    for (const e of panels) e.el.classList.toggle('primary', e === primary);
    return primary;
  }

  function addPanel(p, instant) {
    const dup = panels.find((e) => e.p.template === p.template && e.p.id === p.id);
    if (dup) { removePanel(dup); }
    const entry = { p, el: null, pinned: false, pinnedAt: 0 };
    entry.el = buildPanel(entry);
    panels.push(entry);
    const primary = layoutPanels();
    while (panels.length > 5) {
      const victim = panels.find((e) => !e.pinned && e !== primary && e !== entry);
      if (!victim) break;
      removePanel(victim);
    }
    if (!instant && !reduced) {
      entry.el.classList.add('entering');
      $('panels').appendChild(entry.el);
      setTimeout(() => entry.el.classList.remove('entering'), 60 * panels.length);
    } else {
      $('panels').appendChild(entry.el);
    }
    layoutPanels();
    syncLayout();
  }

  if (!reduced) {
    const cv = $('embers'), cx = cv.getContext('2d');
    let W, H; const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
    size(); addEventListener('resize', size);
    const motes = Array.from({ length: 18 }, () => ({
      x: Math.random(), y: Math.random(), s: .4 + Math.random() * 1.2, v: .00025 + Math.random() * .0006, a: .08 + Math.random() * .2,
    }));
    (function tick() {
      cx.clearRect(0, 0, W, H);
      for (const m of motes) {
        m.y -= m.v; if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); }
        cx.globalAlpha = m.a; cx.fillStyle = '#1b9fff';
        cx.beginPath(); cx.arc(m.x * W, m.y * H, m.s, 0, 7); cx.fill();
      }
      requestAnimationFrame(tick);
    })();
    addEventListener('pointermove', (e) => {
      const dx = (e.clientX / innerWidth - .5) * 14, dy = (e.clientY / innerHeight - .5) * 10;
      $('field').style.transform = `translate(${-dx}px, ${-dy}px)`;
    });
  }

  function fmtUp(s) {
    if (s == null) return '—';
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return h ? `${h}h ${m}m` : `${m}m`;
  }

  async function refresh() {
    try {
      const st = await (await fetch('/status')).json();
      const model = (st.model || '').replace(/^claude-/, '').replace(/-\d.*$/, '') || '';
      $('mBrain').textContent = st.brain || 'offline';
      $('mBrain').className = 'v' + (st.brain === 'offline' ? '' : ' gold');
      if (model) $('mBrain').appendChild(el('span', 'sub', model));
      const appr = (st.pendingConfirms?.length ?? 0)
        + Object.values(st.pendingProposals ?? {}).reduce((a, b) => a + (b || 0), 0);
      $('mAppr').textContent = String(appr);
      $('mAppr').className = appr > 0 ? 'v gold pulse' : 'v';
      $('mChain').textContent = st.chainIntact === false ? 'BROKEN' : (st.chainIntact ? 'intact' : '—');
      $('mChain').className = st.chainIntact === false ? 'v red' : 'v jade';
      $('mUp').textContent = fmtUp(st.uptimeSec);
      orb.set(st.halted ? 'offline' : (st.brain === 'offline' ? 'offline' : st.brain));
    } catch { $('mBrain').textContent = 'unreachable'; $('mBrain').className = 'v red'; orb.set('offline'); }
  }

  const wave = { levels: new Array(64).fill(0), lastLoud: 0 };
  const SPEAKING = 80;
  function drawWave() {
    const cv = $('wave'), cx = cv.getContext('2d');
    const W = cv.width, H = cv.height, mid = H / 2, n = wave.levels.length;
    cx.clearRect(0, 0, W, H);
    const grad = cx.createLinearGradient(0, H, 0, 0);
    grad.addColorStop(0, '#164a98'); grad.addColorStop(.6, '#1b9fff'); grad.addColorStop(1, '#dcf8ff');
    cx.fillStyle = grad;
    const step = W / n;
    for (let i = 0; i < n; i++) {
      const h = Math.max(1, Math.min(1, wave.levels[i] / 900) * (mid - 4));
      cx.fillRect(i * step + step * .3, mid - h, step * .4, h * 2);
    }
  }
  function onMicLevel(level) {
    wave.levels.push(level); wave.levels.shift();
    if (level > SPEAKING) wave.lastLoud = Date.now();
    $('wave').classList.toggle('talking', Date.now() - wave.lastLoud < 600);
    drawWave();
  }

  let pending = null;
  function nudge() { if (!pending) pending = setTimeout(() => { pending = null; refresh(); }, 1200); }
  function connect() {
    const es = new EventSource('/events');
    es.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { nudge(); return; }
      if (m.type === 'mic-level') { onMicLevel(Number(m.level) || 0); return; }
      nudge();
      if (m.type === 'lens-panel' && m.panel) addPanel(m.panel);
    };
    es.onerror = () => { es.close(); setTimeout(connect, 4000); };
  }
  fetch('/lens/state').then((r) => r.json())
    .then((s) => { for (const p of s.panels || []) addPanel(p, true); })
    .catch(() => {});
  refresh(); connect(); setInterval(refresh, 60_000);
</script>
</body>
</html>
